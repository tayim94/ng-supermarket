<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NG Supermarket</title>
<meta name="description" content="NG Supermarket — Instagram և Facebook">
<style>
  :root { --bg:#d90000; --card:#ffffff; --text:#1d2420; --muted:#66706a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 30%, #ff1a1a, #b30000) fixed; background-color:var(--bg); color:var(--text); padding:24px 16px;
         font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:24px;
          padding:40px 24px 32px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .logo { display:block; width:150px; height:150px; border-radius:28px; margin:0 auto 20px;
          box-shadow:0 6px 20px rgba(200,0,0,.25); }
  h1 { font-size:26px; margin-bottom:6px; }
  p { color:var(--muted); font-size:16px; line-height:1.4; margin-bottom:28px; }
  a.btn { display:flex; align-items:center; justify-content:center; gap:12px;
          width:100%; padding:18px; margin-bottom:14px; border-radius:16px;
          color:#fff; text-decoration:none; font-size:19px; font-weight:700;
          transition:transform .1s; }
  a.btn:active { transform:scale(.97); }
  a.btn svg { width:26px; height:26px; flex:none; }
  .ig { background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888); }
  .fb { background:#1877F2; }
  footer { margin-top:18px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.jpg" alt="NG Supermarket">
    <h1>NG Supermarket</h1>
    <p>Հետևեք մեզ սոցիալական ցանցերում<br>Подписывайтесь на нас</p>

    <a class="btn ig" href="https://www.instagram.com/_ng_supermarket_/" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      Instagram
    </a>
    <a class="btn fb" href="https://www.facebook.com/ngsupermarket" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v2H7v4h2v9h4v-9h3l1-4h-4V9c0-.6.4-1 1-1z"/></svg>
      Facebook
    </a>
    <footer>© NG Supermarket</footer>
  </main>
</body>
</html>
